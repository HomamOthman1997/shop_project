<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f7fafc" />
    <title>PHANTOM Numbers V2</title>
    <link rel="stylesheet" href="/mini/numbers-v2/static/styles.css?v=20260527-v2-001" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body class="app-booting">
    <div class="boot-screen" id="bootScreen">
      <div class="boot-mark">PH</div>
      <strong>PHANTOM NUMBERS</strong>
    </div>

    <main class="mini-app" id="app">
      <header class="app-header">
        <button class="icon-button menu-button" type="button" aria-label="القائمة">
          <span></span><span></span><span></span>
        </button>
        <div class="brand">
          <div class="brand-dot">••</div>
          <div>
            <h1>PHANTOM</h1>
            <p>NUMBERS</p>
          </div>
        </div>
        <button class="balance-card" id="balanceButton" type="button">
          <strong id="balanceLabel">$0.00</strong>
          <span>الرصيد</span>
          <i aria-hidden="true"></i>
        </button>
      </header>

      <section class="view active" id="view-buy" data-view="buy">
        <section class="buy-panel">
          <div class="panel-title">
            <h2>شراء رقم جديد</h2>
          </div>
          <div class="segments" id="modeSegments"></div>

          <button class="field field-service" id="serviceButton" type="button">
            <span id="serviceLabel">اختر الخدمة</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-5.4-5.4M10.8 18a7.2 7.2 0 1 1 0-14.4 7.2 7.2 0 0 1 0 14.4Z"/></svg>
          </button>

          <div class="field-row">
            <button class="field" id="countryButton" type="button"><span id="countryLabel">الولايات المتحدة · US</span></button>
            <button class="field" id="stateButton" type="button"><span id="stateLabel">أي ولاية</span></button>
          </div>
          <div class="suggestion-strip hidden" id="countrySuggestions" aria-label="اقتراحات الدول"></div>
        </section>

        <button class="primary-button" id="checkPricesButton" type="button">فحص الأسعار</button>
        <p class="live-line" id="liveLine">أسعار محدثة · مناسبة لـ 390px</p>

        <section class="offers-section">
          <div class="section-head">
            <h2>أفضل<br />العروض</h2>
            <span id="offersCount">0 عروض</span>
          </div>
          <div class="offer-list" id="offerList"></div>
        </section>
      </section>

      <section class="view" id="view-orders" data-view="orders">
        <div class="section-head page-head">
          <h2>طلباتي</h2>
          <button class="ghost-button" id="refreshOrdersButton" type="button">تحديث</button>
        </div>
        <div class="filter-tabs" id="orderFilters" aria-label="فلترة الطلبات"></div>
        <div class="stack" id="ordersList"></div>
      </section>

      <section class="view" id="view-recharge" data-view="recharge">
        <div class="section-head page-head"><h2>شحن الرصيد</h2></div>
        <div class="stack" id="rechargeContent"></div>
        <form class="support-form recharge-form hidden" id="rechargeForm">
          <label>
            <span>طريقة الدفع</span>
            <select id="rechargeMethod"></select>
          </label>
          <div class="method-details" id="rechargeMethodDetails"></div>
          <label>
            <span>المبلغ المدفوع</span>
            <input id="rechargeAmount" name="paid_amount" type="number" inputmode="decimal" min="0" step="0.0001" placeholder="USD" />
          </label>
          <label>
            <span>إثبات الدفع</span>
            <input id="rechargeProof" name="proof" type="file" accept="image/*,.pdf" />
          </label>
          <button class="primary-button" type="submit">إرسال طلب الشحن</button>
          <p class="status-text" id="rechargeStatus"></p>
        </form>
      </section>

      <section class="view" id="view-account" data-view="account">
        <div class="section-head page-head"><h2>حسابي</h2></div>
        <div class="stack" id="accountContent"></div>
      </section>

      <section class="view" id="view-support" data-view="support">
        <div class="section-head page-head"><h2>الدعم</h2></div>
        <form class="support-form" id="supportForm">
          <label>
            <span>القسم</span>
            <select id="supportCategory"></select>
          </label>
          <label>
            <span>الطلب المرتبط</span>
            <select id="supportOrder"></select>
          </label>
          <label>
            <span>الرسالة</span>
            <textarea id="supportMessage" rows="4" placeholder="اكتب المشكلة أو رقم الطلب"></textarea>
          </label>
          <button class="primary-button" type="submit">إرسال</button>
          <p class="status-text" id="supportStatus"></p>
        </form>
      </section>

      <nav class="bottom-nav" id="bottomNav" aria-label="التنقل">
        <button class="nav-item active" type="button" data-view="buy"><span class="nav-icon bag"></span><span>شراء</span></button>
        <button class="nav-item" type="button" data-view="orders"><span class="nav-icon list"></span><span>طلباتي</span></button>
        <button class="nav-item" type="button" data-view="recharge"><span class="nav-icon card"></span><span>شحن</span></button>
        <button class="nav-item" type="button" data-view="account"><span class="nav-icon user"></span><span>حسابي</span></button>
        <button class="nav-item" type="button" data-view="support"><span class="nav-icon help"></span><span>الدعم</span></button>
      </nav>
    </main>

    <div class="drawer hidden" id="pickerDrawer" aria-live="polite">
      <div class="drawer-card">
        <header>
          <h3 id="drawerTitle">اختيار</h3>
          <button class="icon-button close-button" id="drawerClose" type="button" aria-label="إغلاق">×</button>
        </header>
        <input class="search-input" id="drawerSearch" type="search" placeholder="بحث" autocomplete="off" />
        <div class="picker-list" id="drawerList"></div>
      </div>
    </div>

    <div class="drawer hidden" id="confirmDrawer">
      <div class="drawer-card confirm-card">
        <header>
          <h3>تأكيد الشراء</h3>
          <button class="icon-button close-button" id="confirmClose" type="button" aria-label="إغلاق">×</button>
        </header>
        <div id="confirmBody"></div>
        <button class="primary-button" id="confirmPurchaseButton" type="button">تأكيد</button>
      </div>
    </div>

    <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
    <div class="busy-overlay hidden" id="busyOverlay" role="status" aria-live="polite">
      <div class="busy-card">
        <span aria-hidden="true"></span>
        <strong id="busyTitle">جاري التنفيذ</strong>
      </div>
    </div>

    <script src="/mini/numbers-v2/static/app.js?v=20260527-v2-001"></script>
  </body>
</html>
