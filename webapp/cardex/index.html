<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0a0e1a" />
    <title>CardEX Prices</title>
    <link rel="stylesheet" href="/mini/cardex/static/styles.css?v=20260518b" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>CardEX Prices</h1>
          <p id="subtitle">Browse card brands, regions, and price categories</p>
        </div>
        <button id="refreshBtn" class="icon-btn" type="button">R</button>
      </header>
      <section class="searchbar">
        <input id="searchInput" type="search" placeholder="Search brand or region" autocomplete="off" />
      </section>
      <nav class="tabs" aria-label="CardEX sections">
        <button id="pricesTab" class="tab active" type="button">Prices</button>
        <button id="cardsTab" class="tab" type="button">My Cards</button>
        <button id="walletTab" class="tab" type="button">Wallet</button>
        <button id="withdrawTab" class="tab" type="button">Withdraw</button>
      </nav>
      <section id="status" class="status">Loading prices...</section>
      <section id="content" class="content" aria-live="polite"></section>
    </main>

    <div id="modal" class="modal hidden">
      <div class="modal-backdrop" data-close="1"></div>
      <form id="priceForm" class="modal-panel">
        <header class="modal-header">
          <h2>Add price category</h2>
          <button id="closeModal" class="icon-btn" type="button">x</button>
        </header>
        <label>Brand<input name="brand" required placeholder="AMAZON" /></label>
        <label>Region<input name="region" required placeholder="USA" /></label>
        <label>Currency<input name="currency" required value="USD" /></label>
        <label>Values<input name="values" required placeholder="1 --> 75 or 10-15-20" /></label>
        <label>Customer rate %<input name="customer_rate" required inputmode="decimal" placeholder="80" /></label>
        <label>Trader rate %<input name="trader_rate" inputmode="decimal" placeholder="78" /></label>
        <label>Note<input name="note" placeholder="Optional public note" /></label>
        <button class="primary" type="submit">Save category</button>
      </form>
    </div>

    <div id="sellModal" class="modal hidden">
      <div class="modal-backdrop" data-close-sell="1"></div>
      <form id="sellForm" class="modal-panel">
        <header class="modal-header">
          <h2>Sell card</h2>
          <button id="closeSellModal" class="icon-btn" type="button">x</button>
        </header>
        <p id="sellSummary" class="modal-subtitle"></p>
        <input name="brand" type="hidden" />
        <input name="region" type="hidden" />
        <input name="currency" type="hidden" />
        <label>Value<input name="denomination" required inputmode="decimal" placeholder="25" /></label>
        <label>Card code<input name="code" required autocomplete="off" placeholder="Enter card code" /></label>
        <label>PIN (optional)<input name="pin" autocomplete="off" placeholder="Enter PIN if available" /></label>
        <div id="quoteBox" class="quote-box hidden"></div>
        <button class="primary" type="submit">Submit card</button>
      </form>
    </div>

    <div id="withdrawModal" class="modal hidden">
      <div class="modal-backdrop" data-close-withdraw="1"></div>
      <form id="withdrawForm" class="modal-panel">
        <header class="modal-header">
          <h2>Request withdrawal</h2>
          <button id="closeWithdrawModal" class="icon-btn" type="button">x</button>
        </header>
        <label>Amount USD<input name="amount_usd" required inputmode="decimal" placeholder="50" /></label>
        <label>Payout currency
          <select name="payout_currency" required>
            <option value="USD">USD</option>
            <option value="SYP">SYP</option>
          </select>
        </label>
        <label>Payout details<textarea name="notes" required rows="4" placeholder="Wallet, account, or pickup details"></textarea></label>
        <button class="primary" type="submit">Send request</button>
      </form>
    </div>

    <script src="/mini/cardex/static/app.js?v=20260518b"></script>
  </body>
</html>
