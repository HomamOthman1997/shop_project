<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0b0e13" />
    <title>Digital Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/mini/digital/static/styles.css?v=20260605a" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow" id="eyebrow">DIGITAL SERVICES</p>
          <h1 id="pageTitle">المتجر</h1>
        </div>
        <div class="header-actions">
          <button class="icon-button" id="languageButton" type="button" aria-label="Change language">EN</button>
          <button class="icon-button" id="refreshButton" type="button" aria-label="Refresh">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v6h-6"/></svg>
          </button>
        </div>
      </header>

      <main id="appContent" class="app-content" aria-live="polite"></main>

      <nav class="bottom-nav" aria-label="Main navigation">
        <button class="nav-item active" type="button" data-tab="store">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9 5 4h14l2 5M5 13v7h14v-7M9 20v-5h6v5M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/></svg>
          <span data-copy="store">المتجر</span>
        </button>
        <button class="nav-item" type="button" data-tab="orders">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2V2Z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>
          <span data-copy="orders">طلباتي</span>
        </button>
        <button class="nav-item" type="button" data-tab="account">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 22a8 8 0 0 1 16 0"/></svg>
          <span data-copy="account">حسابي</span>
        </button>
      </nav>
    </div>

    <div id="sheet" class="sheet hidden" aria-hidden="true">
      <button class="sheet-backdrop" type="button" data-sheet-close aria-label="Close"></button>
      <section class="sheet-panel" role="dialog" aria-modal="true">
        <div class="sheet-handle"></div>
        <div id="sheetContent"></div>
      </section>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>
    <script src="/mini/digital/static/app.js?v=20260605a"></script>
  </body>
</html>
