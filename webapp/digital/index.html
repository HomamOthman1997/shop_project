<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Digital Store</title>
    <link rel="stylesheet" href="/mini/digital/static/styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1 id="title">Digital Store</h1>
        </div>
        <div class="topbar-actions">
          <button id="langBtn" class="icon-btn" aria-label="Switch language">AR</button>
          <button id="refreshBtn" class="icon-btn" aria-label="Refresh">R</button>
        </div>
      </header>

      <section class="searchbar">
        <input id="searchInput" type="search" placeholder="Search" autocomplete="off" />
      </section>

      <section id="status" class="status">Loading store...</section>
      <section id="content" class="content" aria-live="polite"></section>
    </main>

    <script src="/mini/digital/static/app.js"></script>
  </body>
</html>
